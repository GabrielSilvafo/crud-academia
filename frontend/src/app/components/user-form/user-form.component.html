<div class="page-header">
  <h1>{{ id ? 'Editar usuário' : 'Novo usuário' }}</h1>
</div>

<form class="card" (ngSubmit)="save()">
  <div class="form-field">
    <label for="name">Nome</label>
    <input type="text" id="name" [(ngModel)]="user.name" name="name" required />
  </div>

  <div class="form-field">
    <label for="email">Email</label>
    <input type="email" id="email" [(ngModel)]="user.email" name="email" required />
  </div>

  <div class="form-field">
    <label for="age">Idade</label>
    <input type="number" id="age" [(ngModel)]="user.age" name="age" />
  </div>

  <div class="form-field form-field-check">
    <input type="checkbox" id="status" [(ngModel)]="user.status" name="status" />
    <label for="status">Usuário ativo</label>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a routerLink="/" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
